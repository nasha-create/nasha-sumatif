<!DOCTYPE html>
<html>
<head>
	<title>Persyaratan</title>
	<style>
		body { font-family: Arial, sans-serif; background-color: #FFFFFF; padding: 25px; color: #333333; }
		h2 { color: #0B6E4F; border-bottom: 2px solid #0B6E4F; padding-bottom: 8px; }
		table { width: 100%; border-collapse: collapse; margin-top: 15px; }
		th, td { border: 1px solid #0B6E4F; padding: 10px; text-align: left; }
		th { background-color: #0B6E4F; color: #ffffff; }
		tr:nth-child(even) { background-color: #E8F5E9; }
	</style>
</head>
<body>
	<h2>Persyaratan Pendaftaran</h2>
	<table>
		<tr>
			<th>No</th>
			<th>Dokumen / Syarat</th>
		</tr>
		<tr><td>1</td><td>Fotokopi Ijazah/SKL SMP/MTs yang telah dilegalisir</td></tr>
		<tr><td>2</td><td>Fotokopi Akta Kelahiran</td></tr>
		<tr><td>3</td><td>Fotokopi Kartu Keluarga</td></tr>
		<tr><td>4</td><td>Pas foto terbaru ukuran 3x4 (background merah)</td></tr>
		<tr><td>5</td><td>Fotokopi rapor semester 1-5</td></tr>
		<tr><td>6</td><td>Surat rekomendasi dari kepala sekolah asal</td></tr>
		<tr><td>7</td><td>Sertifikat prestasi (jika ada)</td></tr>
	</table>
</body>
</html>
